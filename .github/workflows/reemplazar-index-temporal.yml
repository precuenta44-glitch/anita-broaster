name: Reemplazar index.html (temporal)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reemplazar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reemplazar index.html con la nueva carta QR
        run: |
          cp anita-broaster-carta-qr.html index.html
          rm anita-broaster-carta-qr.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html anita-broaster-carta-qr.html
          git commit -m "Reemplazar index.html con la nueva carta QR agrupada por categorías"
          git push
