name: Renombrar carta a index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Renombrar anita-broaster-carta-qr.html a index.html
        run: |
          git config user.name "precuenta44-glitch"
          git config user.email "precuenta44-glitch@users.noreply.github.com"
          mv anita-broaster-carta-qr.html index.html
          git add -A
          git commit -m "Actualizar index.html desde anita-broaster-carta-qr.html"
          git push
