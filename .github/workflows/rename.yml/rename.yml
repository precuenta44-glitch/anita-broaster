name: Rename carta to index
on:
  workflow_dispatch:
jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rename carta file to index.html
        run: |
          mv anita-broaster-carta-qr.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publicar carta actualizada como index.html" || echo "Sin cambios"
          git push
