name: rename

on:
  workflow_dispatch:

jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Renombrar carta a index
        run: |
          mv anita-broaster-carta-qr.html index.html
          git config user.name "precuenta44-glitch"
          git config user.email "precuenta44-glitch@users.noreply.github.com"
          git add -A
          git commit -m "Opciones por plato (Combinados y Mixtos)" || echo "sin cambios"
          git push
