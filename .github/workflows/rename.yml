name: Renombrar carta a index.html

on:
  workflow_dispatch:

jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Mover la carta a index.html y publicar
        run: |
          mv anita-broaster-carta-qr.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Renombrar carta a index.html"
          git push
