name: Rename carta to index.html

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename carta to index.html
        run: mv anita-broaster-carta-qr.html index.html
      - name: Commit and push index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html anita-broaster-carta-qr.html
          git commit -m "Rename carta to index.html"
          git push
