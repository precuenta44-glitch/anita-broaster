name: Rename carta to index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move carta to index
        run: mv anita-broaster-carta-qr.html index.html
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html anita-broaster-carta-qr.html
          git commit -m "Actualizar index.html desde anita-broaster-carta-qr.html" || exit 0
          git push
