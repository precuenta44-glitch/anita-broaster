name: Rename carta to index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move carta to index.html
        run: |
          mv anita-broaster-carta-qr.html index.html
          git config user.name "precuenta44-glitch"
          git config user.email "precuenta44-glitch@users.noreply.github.com"
          git add -A
          git commit -m "Actualizar index.html desde anita-broaster-carta-qr.html" || echo "No changes to commit"
          git push
