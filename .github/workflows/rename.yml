name: Rename carta to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename carta file to index
        run: |
          mv anita-broaster-carta-qr.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Pestañas de categorías en el menú de la carta" || echo "No changes to commit"
          git push
